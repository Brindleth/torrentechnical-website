  <!-- IC chip outline (small detail) -->
  <rect x="440" y="40" width="60" height="30" rx="2"/>
  <line x1="448" y1="40" x2="448" y2="34"/>
  <line x1="460" y1="40" x2="460" y2="34"/>
  <line x1="472" y1="40" x2="472" y2="34"/>
  <line x1="484" y1="40" x2="484" y2="34"/>
  <line x1="496" y1="40" x2="496" y2="34"/>
  <line x1="448" y1="70" x2="448" y2="76"/>
