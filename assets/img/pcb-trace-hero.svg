<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" stroke="#C9A961" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main trace network -->
  <path d="M 600 80 L 480 80 L 460 100 L 460 180 L 440 200 L 320 200 L 300 220 L 300 340"/>
