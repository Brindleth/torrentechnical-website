  <circle cx="380" cy="520" r="4" fill="#C9A961" stroke="none"/>
  <circle cx="460" cy="480" r="4" fill="#C9A961" stroke="none"/>
  <circle cx="420" cy="360" r="4" fill="#C9A961" stroke="none"/>
