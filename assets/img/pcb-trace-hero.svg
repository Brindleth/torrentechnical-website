  <line x1="472" y1="70" x2="472" y2="76"/>
  <line x1="484" y1="70" x2="484" y2="76"/>
  <line x1="496" y1="70" x2="496" y2="76"/>

  <!-- Resistor / capacitor stylization -->
  <rect x="340" y="190" width="20" height="12" rx="1"/>
  <rect x="340" y="290" width="20" height="12" rx="1"/>

  <!-- Test point markers -->
  <circle cx="600" cy="80" r="3" fill="none"/>
